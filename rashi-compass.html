<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Rashi Compass</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: radial-gradient(circle at 50% 0%, #1a1a2e 0%, #0d0d16 60%, #08080d 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #f0ede4;
    overflow-x: hidden;
  }
  .wrap {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 20px 40px;
  }
  h1 {
    font-size: 15px;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: 600;
    color: #c9a15a;
    margin: 0 0 2px;
  }
  .sub {
    font-size: 11px;
    color: #7a7a88;
    margin-bottom: 22px;
    text-align: center;
  }
  .compass-shell {
    position: relative;
    width: min(78vw, 320px);
    height: min(78vw, 320px);
    margin: 6px 0 20px;
  }
  .ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: linear-gradient(160deg, #1e1e2f, #101018);
    box-shadow:
      0 0 0 1px rgba(201,161,90,0.25),
      0 20px 50px rgba(0,0,0,0.6),
      inset 0 0 30px rgba(0,0,0,0.5);
  }
  .dial {
    position: absolute;
    inset: 10%;
    border-radius: 50%;
    transition: transform 0.15s ease-out;
  }
  .dial svg { width: 100%; height: 100%; display: block; }
  .center-readout {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  .deg {
    font-size: 15px;
    font-weight: 700;
    color: #f0ede4;
    letter-spacing: 0.5px;
  }
  .needle {
    position: absolute;
    top: 4%;
    left: 50%;
    width: 2px;
    height: 8%;
    background: #d94f4f;
    transform: translateX(-50%);
    border-radius: 2px;
  }
  .rashi-card {
    width: 100%;
    max-width: 360px;
    background: linear-gradient(145deg, #1c1c2a, #14141e);
    border: 1px solid rgba(201,161,90,0.25);
    border-radius: 16px;
    padding: 20px 22px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }
  .rashi-name {
    font-size: 26px;
    font-weight: 700;
    color: #c9a15a;
    margin-bottom: 4px;
  }
  .rashi-direction {
    font-size: 14px;
    color: #9d9db0;
    margin-bottom: 10px;
  }
  .rashi-range {
    font-size: 12px;
    color: #6f6f80;
    border-top: 1px solid rgba(255,255,255,0.06);
    padding-top: 10px;
    margin-top: 6px;
  }
  .status {
    margin-top: 18px;
    font-size: 12px;
    color: #7a7a88;
    text-align: center;
    max-width: 320px;
    line-height: 1.5;
  }
  button {
    margin-top: 18px;
    padding: 12px 26px;
    border-radius: 30px;
    border: none;
    background: linear-gradient(145deg, #c9a15a, #a97f3f);
    color: #14141e;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.3px;
    cursor: pointer;
  }
  button:active { transform: scale(0.97); }
  .table-toggle {
    margin-top: 26px;
    font-size: 12px;
    color: #c9a15a;
    text-decoration: underline;
    background: none;
    border: none;
    padding: 0;
    font-weight: 600;
    letter-spacing: 0.3px;
  }
  table {
    margin-top: 14px;
    width: 100%;
    max-width: 360px;
    border-collapse: collapse;
    font-size: 12px;
    display: none;
  }
  table.show { display: table; }
  th, td {
    padding: 6px 8px;
    text-align: left;
    border-bottom: 1px solid rgba(255,255,255,0.07);
  }
  th { color: #c9a15a; font-weight: 600; }
  tr.active td { color: #f0ede4; font-weight: 700; background: rgba(201,161,90,0.08); }
  td { color: #9d9db0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Rashi Compass</h1>
  <div class="sub">True-north heading mapped to your 12-rashi Vastu table</div>

  <div class="compass-shell">
    <div class="ring"></div>
    <div class="dial" id="dial">
      <svg viewBox="0 0 200 200">
        <circle cx="100" cy="100" r="90" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
        <g id="ticks"></g>
        <g id="labels" font-size="11" fill="#7a7a88" font-family="-apple-system, sans-serif" text-anchor="middle"></g>
      </svg>
    </div>
    <div class="needle"></div>
    <div class="center-readout">
      <div class="deg" id="degReadout">--°</div>
    </div>
  </div>

  <div class="rashi-card">
    <div class="rashi-name" id="rashiName">—</div>
    <div class="rashi-direction" id="rashiDir">—</div>
    <div class="rashi-range" id="rashiRange">Tap Start to begin</div>
  </div>

  <button id="startBtn">Start Compass</button>
  <div class="status" id="statusMsg"></div>

  <button class="table-toggle" id="toggleTable">Show full table</button>
  <table id="rashiTable">
    <thead><tr><th>#</th><th>Rashi</th><th>Direction</th><th>Range</th></tr></thead>
    <tbody></tbody>
  </table>
</div>

<script>
const RASHI = [
  { n:1, name:"Aries",       dir:"East",           lo:0,   hi:30 },
  { n:2, name:"Taurus",      dir:"NW (WNW)",       lo:30,  hi:60 },
  { n:3, name:"Gemini",      dir:"NNW",            lo:60,  hi:90 },
  { n:4, name:"Cancer",      dir:"NNE",            lo:90,  hi:120 },
  { n:5, name:"Leo",         dir:"ENE",            lo:120, hi:150 },
  { n:6, name:"Virgo",       dir:"North",          lo:150, hi:180 },
  { n:7, name:"Libra",       dir:"WSW",            lo:180, hi:210 },
  { n:8, name:"Scorpio",     dir:"SSW (SW)",       lo:210, hi:240 },
  { n:9, name:"Sagittarius", dir:"NE",             lo:240, hi:270 },
  { n:10,name:"Capricorn",  dir:"South (SSE)",     lo:270, hi:300 },
  { n:11,name:"Aquarius",   dir:"West (WSW)",      lo:300, hi:330 },
  { n:12,name:"Pisces",     dir:"SE",              lo:330, hi:360 },
];

const dial = document.getElementById('dial');
const degReadout = document.getElementById('degReadout');
const rashiName = document.getElementById('rashiName');
const rashiDir = document.getElementById('rashiDir');
const rashiRange = document.getElementById('rashiRange');
const statusMsg = document.getElementById('statusMsg');
const startBtn = document.getElementById('startBtn');
const toggleTableBtn = document.getElementById('toggleTable');
const rashiTableEl = document.getElementById('rashiTable');
const tbody = rashiTableEl.querySelector('tbody');

// Build ticks/labels on the dial (fixed ring; needle stays fixed at top, ring rotates)
const ticks = document.getElementById('ticks');
const labels = document.getElementById('labels');
const cardinals = [
  {deg:0, label:'N'}, {deg:45, label:'NE'}, {deg:90, label:'E'}, {deg:135, label:'SE'},
  {deg:180, label:'S'}, {deg:225, label:'SW'}, {deg:270, label:'W'}, {deg:315, label:'NW'}
];
for (let d = 0; d < 360; d += 15) {
  const rad = (d - 90) * Math.PI / 180;
  const isMajor = d % 90 === 0;
  const r1 = isMajor ? 78 : 82;
  const r2 = 90;
  const x1 = 100 + r1 * Math.cos(rad);
  const y1 = 100 + r1 * Math.sin(rad);
  const x2 = 100 + r2 * Math.cos(rad);
  const y2 = 100 + r2 * Math.sin(rad);
  const line = document.createElementNS('http://www.w3.org/2000/svg','line');
  line.setAttribute('x1', x1); line.setAttribute('y1', y1);
  line.setAttribute('x2', x2); line.setAttribute('y2', y2);
  line.setAttribute('stroke', isMajor ? '#c9a15a' : 'rgba(255,255,255,0.2)');
  line.setAttribute('stroke-width', isMajor ? 2 : 1);
  ticks.appendChild(line);
}
cardinals.forEach(c => {
  const rad = (c.deg - 90) * Math.PI / 180;
  const x = 100 + 66 * Math.cos(rad);
  const y = 100 + 66 * Math.sin(rad);
  const t = document.createElementNS('http://www.w3.org/2000/svg','text');
  t.setAttribute('x', x); t.setAttribute('y', y + 4);
  t.textContent = c.label;
  t.setAttribute('fill', c.label === 'N' ? '#d94f4f' : '#9d9db0');
  t.setAttribute('font-weight', c.label === 'N' ? '700' : '400');
  labels.appendChild(t);
});

// Populate reference table
RASHI.forEach(r => {
  const tr = document.createElement('tr');
  tr.id = 'row-' + r.n;
  tr.innerHTML = `<td>${r.n}</td><td>${r.name}</td><td>${r.dir}</td><td>${r.lo}°–${r.hi}°</td>`;
  tbody.appendChild(tr);
});

toggleTableBtn.addEventListener('click', () => {
  rashiTableEl.classList.toggle('show');
  toggleTableBtn.textContent = rashiTableEl.classList.contains('show') ? 'Hide full table' : 'Show full table';
});

function findRashi(heading) {
  const h = ((heading % 360) + 360) % 360;
  return RASHI.find(r => h >= r.lo && h < r.hi) || RASHI[RASHI.length - 1];
}

let lastRow = null;
function updateUI(heading) {
  const h = ((heading % 360) + 360) % 360;
  degReadout.textContent = Math.round(h) + '°';
  dial.style.transform = `rotate(${-h}deg)`;

  const match = findRashi(h);
  rashiName.textContent = match.name;
  rashiDir.textContent = match.dir;
  rashiRange.textContent = `${match.lo}° – ${match.hi}°  ·  Rashi #${match.n}`;

  if (lastRow) lastRow.classList.remove('active');
  const row = document.getElementById('row-' + match.n);
  if (row) { row.classList.add('active'); lastRow = row; }
}

function handleOrientation(e) {
  let heading = null;
  if (typeof e.webkitCompassHeading === 'number') {
    // iOS Safari: already true-north-ish compass heading, clockwise from north
    heading = e.webkitCompassHeading;
  } else if (e.absolute && e.alpha !== null) {
    heading = 360 - e.alpha;
  } else if (e.alpha !== null) {
    heading = 360 - e.alpha;
  }
  if (heading !== null) updateUI(heading);
}

function startCompass() {
  statusMsg.textContent = '';
  if (typeof DeviceOrientationEvent !== 'undefined' &&
      typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission().then(state => {
      if (state === 'granted') {
        window.addEventListener('deviceorientation', handleOrientation, true);
        startBtn.style.display = 'none';
        statusMsg.textContent = 'Hold phone flat, screen facing up, for accurate reading.';
      } else {
        statusMsg.textContent = 'Compass permission denied. Enable Motion & Orientation access in Settings > Safari.';
      }
    }).catch(err => {
      statusMsg.textContent = 'Could not access compass: ' + err.message;
    });
  } else if ('ondeviceorientationabsolute' in window) {
    window.addEventListener('deviceorientationabsolute', handleOrientation, true);
    startBtn.style.display = 'none';
    statusMsg.textContent = 'Hold phone flat, screen facing up, for accurate reading.';
  } else if (typeof DeviceOrientationEvent !== 'undefined') {
    window.addEventListener('deviceorientation', handleOrientation, true);
    startBtn.style.display = 'none';
    statusMsg.textContent = 'Hold phone flat, screen facing up, for accurate reading.';
  } else {
    statusMsg.textContent = 'Compass sensor not available on this device/browser.';
  }
}

startBtn.addEventListener('click', startCompass);
</script>
</body>
</html>
