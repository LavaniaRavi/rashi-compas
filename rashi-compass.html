<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Navagraha Rashi Compass</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: radial-gradient(circle at 50% 0%, #1a1a2e 0%, #0d0d16 60%, #08080d 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #f0ede4;
  }
  .wrap { display: flex; flex-direction: column; align-items: center; padding: 24px 16px 40px; max-width: 480px; margin: 0 auto; }
  h1 { font-size: 15px; letter-spacing: 2px; text-transform: uppercase; font-weight: 600; color: #c9a15a; margin: 0 0 2px; text-align: center; }
  .sub { font-size: 11px; color: #7a7a88; margin-bottom: 20px; text-align: center; }

  .panel {
    width: 100%;
    background: linear-gradient(145deg, #1c1c2a, #14141e);
    border: 1px solid rgba(201,161,90,0.25);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 18px;
  }
  .panel h2 {
    font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase;
    color: #c9a15a; margin: 0 0 12px; font-weight: 600;
  }
  .planet-row {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .planet-row:last-child { border-bottom: none; }
  .planet-dot {
    width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
  }
  .planet-label { flex: 0 0 74px; font-size: 13px; color: #d8d5c9; }
  .planet-row .deg-min {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 4px;
    min-width: 0;
  }
  .planet-row input {
    background: #0d0d16;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 8px;
    color: #f0ede4;
    padding: 8px 6px;
    font-size: 14px;
    min-width: 0;
    text-align: center;
  }
  .planet-row input.deg-input { flex: 1.3; }
  .planet-row input.min-input { flex: 1; }
  .planet-row .unit { font-size: 12px; color: #7a7a88; flex: 0 0 auto; }
  .planet-row input::placeholder { color: #55556a; }
  .planet-result { flex: 0 0 auto; font-size: 11px; color: #9d9db0; text-align: right; min-width: 74px; }

  button.calc {
    margin-top: 14px;
    width: 100%;
    padding: 13px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(145deg, #c9a15a, #a97f3f);
    color: #14141e;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.3px;
  }
  button.calc:active { transform: scale(0.98); }

  .results { width: 100%; margin-bottom: 18px; display: none; }
  .results.show { display: block; }
  .result-card {
    display: flex; align-items: center; gap: 10px;
    background: linear-gradient(145deg, #1c1c2a, #14141e);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 10px 14px;
    margin-bottom: 8px;
  }
  .result-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .result-main { flex: 1; }
  .result-planet { font-size: 12px; color: #9d9db0; }
  .result-rashi { font-size: 15px; font-weight: 700; color: #f0ede4; }
  .result-dir { font-size: 12px; color: #c9a15a; text-align: right; }
  .result-range { font-size: 10px; color: #6f6f80; text-align: right; }

  .compass-shell {
    position: relative;
    width: min(78vw, 320px);
    height: min(78vw, 320px);
    margin: 6px 0 16px;
  }
  .ring { position: absolute; inset: 0; border-radius: 50%;
    background: linear-gradient(160deg, #1e1e2f, #101018);
    box-shadow: 0 0 0 1px rgba(201,161,90,0.25), 0 20px 50px rgba(0,0,0,0.6), inset 0 0 30px rgba(0,0,0,0.5);
  }
  .dial { position: absolute; inset: 10%; border-radius: 50%; transition: transform 0.15s ease-out; }
  .dial svg { width: 100%; height: 100%; display: block; }
  .center-readout { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
  .deg { font-size: 15px; font-weight: 700; color: #f0ede4; letter-spacing: 0.5px; }
  .needle { position: absolute; top: 4%; left: 50%; width: 2px; height: 8%; background: #d94f4f; transform: translateX(-50%); border-radius: 2px; z-index: 5; }

  .status { margin-top: 4px; font-size: 12px; color: #7a7a88; text-align: center; max-width: 320px; line-height: 1.5; }
  button.startbtn {
    margin-top: 14px; padding: 12px 26px; border-radius: 30px; border: none;
    background: linear-gradient(145deg, #c9a15a, #a97f3f); color: #14141e;
    font-weight: 700; font-size: 14px; letter-spacing: 0.3px;
  }
  button.startbtn:active { transform: scale(0.97); }

  .legend { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: #9d9db0; }
  .legend-dot { width: 9px; height: 9px; border-radius: 50%; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Navagraha Rashi Compass</h1>
  <div class="sub">Enter each planet's zodiac degree (0°&ndash;360°) to find its Rashi and Vastu direction</div>

  <div class="panel">
    <h2>Planet Degrees</h2>
    <div id="planetRows"></div>
    <button class="calc" id="calcBtn">Calculate Directions</button>
  </div>

  <div class="results" id="results"></div>

  <div class="compass-shell">
    <div class="ring"></div>
    <div class="dial" id="dial">
      <svg viewBox="0 0 200 200">
        <circle cx="100" cy="100" r="90" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
        <g id="ticks"></g>
        <g id="labels" font-size="11" fill="#7a7a88" font-family="-apple-system, sans-serif" text-anchor="middle"></g>
        <g id="markers"></g>
      </svg>
    </div>
    <div class="needle"></div>
    <div class="center-readout"><div class="deg" id="degReadout">--°</div></div>
  </div>

  <button class="startbtn" id="startBtn">Start Compass</button>
  <div class="status" id="statusMsg">Calculate above, then start the compass to align.</div>

  <div class="legend" id="legend"></div>
</div>

<script>
const RASHI = [
  { n:1, name:"Aries",       dir:"East",        lo:0,   hi:30,  bearing:90 },
  { n:2, name:"Taurus",      dir:"NW (WNW)",    lo:30,  hi:60,  bearing:315 },
  { n:3, name:"Gemini",      dir:"NNW",         lo:60,  hi:90,  bearing:337.5 },
  { n:4, name:"Cancer",      dir:"NNE",         lo:90,  hi:120, bearing:22.5 },
  { n:5, name:"Leo",         dir:"ENE",         lo:120, hi:150, bearing:67.5 },
  { n:6, name:"Virgo",       dir:"North",       lo:150, hi:180, bearing:0 },
  { n:7, name:"Libra",       dir:"WSW",         lo:180, hi:210, bearing:247.5 },
  { n:8, name:"Scorpio",     dir:"SSW (SW)",    lo:210, hi:240, bearing:202.5 },
  { n:9, name:"Sagittarius", dir:"NE",          lo:240, hi:270, bearing:45 },
  { n:10,name:"Capricorn",  dir:"South (SSE)",  lo:270, hi:300, bearing:180 },
  { n:11,name:"Aquarius",   dir:"West (WSW)",   lo:300, hi:330, bearing:270 },
  { n:12,name:"Pisces",     dir:"SE",           lo:330, hi:360, bearing:135 },
];

const PLANETS = [
  { key:"su", label:"Sun",     color:"#e8b84b" },
  { key:"mo", label:"Moon",    color:"#d8d8e0" },
  { key:"ma", label:"Mars",    color:"#e05d4c" },
  { key:"me", label:"Mercury", color:"#4bc98f" },
  { key:"ju", label:"Jupiter", color:"#e0a83f" },
  { key:"ve", label:"Venus",   color:"#e08fd0" },
  { key:"sa", label:"Saturn",  color:"#6a7bd0" },
  { key:"ra", label:"Rahu",    color:"#8d8d8d" },
  { key:"ke", label:"Ketu",    color:"#a86a3f" },
];

function findRashi(deg) {
  const d = ((deg % 360) + 360) % 360;
  return RASHI.find(r => d >= r.lo && d < r.hi) || RASHI[RASHI.length - 1];
}

// Build input rows
const rowsEl = document.getElementById('planetRows');
PLANETS.forEach(p => {
  const row = document.createElement('div');
  row.className = 'planet-row';
  row.innerHTML = `
    <div class="planet-dot" style="background:${p.color}"></div>
    <div class="planet-label">${p.label}</div>
    <div class="deg-min">
      <input type="number" min="0" max="360" step="1" placeholder="deg" class="deg-input" id="deg-${p.key}">
      <span class="unit">°</span>
      <input type="number" min="0" max="59" step="1" placeholder="min" class="min-input" id="min-${p.key}">
      <span class="unit">'</span>
    </div>
  `;
  rowsEl.appendChild(row);
});

// Build compass ticks/cardinal labels (true heading based)
const ticks = document.getElementById('ticks');
const labels = document.getElementById('labels');
const cardinals = [
  {deg:0, label:'N'}, {deg:45, label:'NE'}, {deg:90, label:'E'}, {deg:135, label:'SE'},
  {deg:180, label:'S'}, {deg:225, label:'SW'}, {deg:270, label:'W'}, {deg:315, label:'NW'}
];
for (let d = 0; d < 360; d += 15) {
  const rad = (d - 90) * Math.PI / 180;
  const isMajor = d % 90 === 0;
  const r1 = isMajor ? 78 : 82, r2 = 90;
  const x1 = 100 + r1 * Math.cos(rad), y1 = 100 + r1 * Math.sin(rad);
  const x2 = 100 + r2 * Math.cos(rad), y2 = 100 + r2 * Math.sin(rad);
  const line = document.createElementNS('http://www.w3.org/2000/svg','line');
  line.setAttribute('x1', x1); line.setAttribute('y1', y1);
  line.setAttribute('x2', x2); line.setAttribute('y2', y2);
  line.setAttribute('stroke', isMajor ? '#c9a15a' : 'rgba(255,255,255,0.2)');
  line.setAttribute('stroke-width', isMajor ? 2 : 1);
  ticks.appendChild(line);
}
cardinals.forEach(c => {
  const rad = (c.deg - 90) * Math.PI / 180;
  const x = 100 + 66 * Math.cos(rad), y = 100 + 66 * Math.sin(rad);
  const t = document.createElementNS('http://www.w3.org/2000/svg','text');
  t.setAttribute('x', x); t.setAttribute('y', y + 4);
  t.textContent = c.label;
  t.setAttribute('fill', c.label === 'N' ? '#d94f4f' : '#9d9db0');
  t.setAttribute('font-weight', c.label === 'N' ? '700' : '400');
  labels.appendChild(t);
});

const markersG = document.getElementById('markers');
const dial = document.getElementById('dial');
const degReadout = document.getElementById('degReadout');
const startBtn = document.getElementById('startBtn');
const statusMsg = document.getElementById('statusMsg');
const calcBtn = document.getElementById('calcBtn');
const resultsEl = document.getElementById('results');
const legendEl = document.getElementById('legend');

let activePlanets = [];

calcBtn.addEventListener('click', () => {
  activePlanets = [];
  resultsEl.innerHTML = '';
  markersG.innerHTML = '';
  legendEl.innerHTML = '';

  PLANETS.forEach(p => {
    const degInput = document.getElementById('deg-' + p.key);
    const minInput = document.getElementById('min-' + p.key);
    const degVal = degInput.value.trim();
    const minVal = minInput.value.trim();
    if (degVal === '' && minVal === '') return;
    const degPart = degVal === '' ? 0 : parseFloat(degVal);
    const minPart = minVal === '' ? 0 : parseFloat(minVal);
    if (isNaN(degPart) || isNaN(minPart)) return;
    const deg = degPart + (minPart / 60);
    const match = findRashi(deg);
    activePlanets.push({ planet: p, deg, degPart, minPart, match });
  });

  if (activePlanets.length === 0) {
    resultsEl.classList.remove('show');
    return;
  }

  resultsEl.classList.add('show');
  activePlanets.forEach(item => {
    const card = document.createElement('div');
    card.className = 'result-card';
    card.innerHTML = `
      <div class="result-dot" style="background:${item.planet.color}"></div>
      <div class="result-main">
        <div class="result-planet">${item.planet.label} · ${item.degPart}° ${item.minPart}'</div>
        <div class="result-rashi">${item.match.name}</div>
      </div>
      <div>
        <div class="result-dir">${item.match.dir}</div>
        <div class="result-range">${item.match.lo}°–${item.match.hi}°</div>
      </div>
    `;
    resultsEl.appendChild(card);

    // Draw marker on compass ring at this rashi's bearing
    const rad = (item.match.bearing - 90) * Math.PI / 180;
    const mx = 100 + 74 * Math.cos(rad);
    const my = 100 + 74 * Math.sin(rad);
    const marker = document.createElementNS('http://www.w3.org/2000/svg','circle');
    marker.setAttribute('cx', mx);
    marker.setAttribute('cy', my);
    marker.setAttribute('r', 6);
    marker.setAttribute('fill', item.planet.color);
    marker.setAttribute('stroke', '#08080d');
    marker.setAttribute('stroke-width', 1.5);
    markersG.appendChild(marker);

    const legendItem = document.createElement('div');
    legendItem.className = 'legend-item';
    legendItem.innerHTML = `<div class="legend-dot" style="background:${item.planet.color}"></div>${item.planet.label}: ${item.match.dir}`;
    legendEl.appendChild(legendItem);
  });
});

function handleOrientation(e) {
  let heading = null;
  if (typeof e.webkitCompassHeading === 'number') {
    heading = e.webkitCompassHeading;
  } else if (e.absolute && e.alpha !== null) {
    heading = 360 - e.alpha;
  } else if (e.alpha !== null) {
    heading = 360 - e.alpha;
  }
  if (heading !== null) {
    const h = ((heading % 360) + 360) % 360;
    degReadout.textContent = Math.round(h) + '°';
    dial.style.transform = `rotate(${-h}deg)`;
  }
}

function startCompass() {
  statusMsg.textContent = '';
  if (typeof DeviceOrientationEvent !== 'undefined' &&
      typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission().then(state => {
      if (state === 'granted') {
        window.addEventListener('deviceorientation', handleOrientation, true);
        startBtn.style.display = 'none';
        statusMsg.textContent = 'Hold phone flat. Rotate until the needle lines up with a colored dot.';
      } else {
        statusMsg.textContent = 'Compass permission denied. Enable Motion & Orientation access in Settings.';
      }
    }).catch(err => {
      statusMsg.textContent = 'Could not access compass: ' + err.message;
    });
  } else if ('ondeviceorientationabsolute' in window) {
    window.addEventListener('deviceorientationabsolute', handleOrientation, true);
    startBtn.style.display = 'none';
    statusMsg.textContent = 'Hold phone flat. Rotate until the needle lines up with a colored dot.';
  } else if (typeof DeviceOrientationEvent !== 'undefined') {
    window.addEventListener('deviceorientation', handleOrientation, true);
    startBtn.style.display = 'none';
    statusMsg.textContent = 'Hold phone flat. Rotate until the needle lines up with a colored dot.';
  } else {
    statusMsg.textContent = 'Compass sensor not available on this device/browser.';
  }
}

startBtn.addEventListener('click', startCompass);
</script>
</body>
</html>
